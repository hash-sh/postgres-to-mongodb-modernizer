# Databases for the modernizer pipeline.
# - postgres: the ORIGINAL app's database (source of truth for migration)
# - mongo:    single-node replica set (rs0) so transactions + change streams work
services:
  postgres:
    image: postgres:16-alpine
    container_name: amp_postgres
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    ports: ["5432:5432"]
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 2s
      retries: 30

  mongo:
    image: mongo:8.2  # 8.0 refuses to start on Linux kernel >= 6.19 (SERVER-121912)
    container_name: amp_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      # Initiates the replica set on first run (idempotent), then reports healthy once PRIMARY.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 3s
      retries: 30
